# This workflow is triggered when a GitHub release is created.
# It can also be run manually to re-publish to NPM in case it failed for some reason.
# You can run this workflow by navigating to https://www.github.com/imtrinity94/vra-iaas-mcp-typescript/actions/workflows/publish-npm.yml
name: Publish NPM
on:
  workflow_dispatch:
    inputs:
      path:
        description: The path to run the release in, e.g. '.' or 'packages/mcp-server'
        required: true

  release:
    types: [published]

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.24.0'

      - name: Install dependencies
        run: |
          pnpm install

      - name: Publish to NPM
        run: |
          if [ -z "${NPM_TOKEN}" ]; then
            echo "NPM token is not configured. Set either VRA_IAAS_NPM_TOKEN or NPM_TOKEN secret."
            exit 1
          fi
          if [ -n "${{ github.event.inputs.path }}" ]; then
            PATHS_RELEASED='[\"${{ github.event.inputs.path }}\"]'
          else
            PATHS_RELEASED='[\".\", \"packages/mcp-server\"]'
          fi
          pnpm tsn scripts/publish-packages.ts "{ \"paths_released\": \"$PATHS_RELEASED\" }"
        env:
          NPM_TOKEN: ${{ secrets.VRA_IAAS_NPM_TOKEN || secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.VRA_IAAS_NPM_TOKEN || secrets.NPM_TOKEN }}

      - name: Upload MCP Server DXT GitHub release asset
        run: |
          gh release upload ${{ github.event.release.tag_name }} \
            packages/mcp-server/vra_iaas_api.mcpb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
